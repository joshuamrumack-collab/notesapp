# Builds the Windows installer for every version tag (v0.2.0, v0.3.0, ...) and publishes it as a GitHub release.
# The installed app reads latest.json from the newest release and offers the update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes App ${{ github.ref_name }}"
          releaseBody: "To install: download the file ending in x64-setup.exe below and run it. If you already have Notes App, it updates itself: open it and click Update."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
